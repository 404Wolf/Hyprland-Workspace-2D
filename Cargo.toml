[package]
name = "workspace2d"
version = "0.1.0"
edition = "2021"

[dependencies]
hyprland = { git = "https://github.com/hyprland-community/hyprland-rs", branch = "master" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
wrapping_coords2d = "0.1.9"

[profile.release]
opt-level = 3
strip = true
lto = true
